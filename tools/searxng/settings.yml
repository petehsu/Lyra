# Engine SQLite cache is not configured here. start.sh sets TMPDIR to
# $LYRA_SEARXNG_HOME/cache so tokens do not live on /tmp.

use_default_settings: true

general:
  debug: false
  instance_name: "Lyra SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
  secret_key: "ultrasecretkey"

valkey:
  url: false

# The default general web engines are duckduckgo, brave, and google cse.
# html.duckduckgo.com does not connect from this network, so every search
# waits out that engine and then comes back empty once brave and google cse
# suspend. Bing and Mwmbl answer without a key. Turn duckduckgo back on if
# that host starts connecting.
engines:
  - name: duckduckgo
    disabled: true
  - name: bing
    disabled: false
  - name: mwmbl
    disabled: false
