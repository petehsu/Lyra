packages:
  - apps/*
  - services/*
  - packages/*
  - web/docs
  - web/site

overrides:
  '@babel/core': 7.29.7
  dompurify: 3.4.12
  immutable: 5.1.8
  js-yaml: 4.3.0
  linkify-it: 5.0.2
  lodash-es: 4.18.0
  postcss: 8.5.18
  sharp: 0.35.0
  uuid: 11.1.1
  ws: 8.21.0

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - electron
  - electron-winstaller
  - esbuild
  - sharp
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  workerd: true
