[package]
name = "lyra-agent-reader"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[lib]
name = "lyra_agent_reader"
path = "src/lib.rs"

[[bin]]
name = "lyra-agent-reader"
path = "src/main.rs"
required-features = ["fetch-reqwest"]

[lints]
workspace = true

[features]
default = ["fetch-reqwest"]
# The reqwest-backed FetchProvider is optional so that consumers that only feed
# raw HTML / bytes (no network) can compile a lean dependency set.
fetch-reqwest = ["dep:reqwest"]
tokenizer-tiktoken = ["dep:tiktoken-rs"]

[dependencies]
lyra-docs-core = { workspace = true }
scraper = { workspace = true }
ego-tree = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde"] }
mime_guess = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
which = { workspace = true }
reqwest = { workspace = true, features = [
    "blocking",
    "rustls-tls",
    "system-proxy",
], optional = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
