[package]
name = "lyra-files-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dirs = "6.0.0"
lyra-files-core = { path = "../lyra-files-core" }
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sysinfo = "0.33.1"
trash = "5.2.5"

[build-dependencies]
napi-build = "2.1.4"
