[package]
name = "codegraph-server"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "CodeGraph MCP/LSP server — cross-language code intelligence"

[[bin]]
name = "codegraph-server"
path = "src/main.rs"

[lib]
name = "codegraph_server"
path = "src/lib.rs"

[dependencies]
# LSP framework
tower-lsp.workspace = true
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Utilities
thiserror.workspace = true
# System memory introspection for the embedding-load RAM gate (OOM avoidance)
sysinfo = "0.30"
dashmap.workspace = true
notify.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
lru.workspace = true
regex.workspace = true
globset.workspace = true

# CodeGraph ecosystem
codegraph.workspace = true
codegraph-parser-api.workspace = true
codegraph-python = { workspace = true, optional = true }
codegraph-rust = { workspace = true, optional = true }
codegraph-typescript = { workspace = true, optional = true }
codegraph-go = { workspace = true, optional = true }
codegraph-c = { workspace = true, optional = true }
codegraph-java = { workspace = true, optional = true }
codegraph-cpp = { workspace = true, optional = true }
codegraph-kotlin = { workspace = true, optional = true }
codegraph-csharp = { workspace = true, optional = true }
codegraph-php = { workspace = true, optional = true }
codegraph-ruby = { workspace = true, optional = true }
codegraph-swift = { workspace = true, optional = true }
codegraph-tcl = { workspace = true, optional = true }
codegraph-verilog = { workspace = true, optional = true }
codegraph-cobol = { workspace = true, optional = true }
codegraph-fortran = { workspace = true, optional = true }
codegraph-dart = { workspace = true, optional = true }
codegraph-zig = { workspace = true, optional = true }
codegraph-lua = { workspace = true, optional = true }
codegraph-groovy = { workspace = true, optional = true }
codegraph-r = { workspace = true, optional = true }
codegraph-scala = { workspace = true, optional = true }
codegraph-bash = { workspace = true, optional = true }
codegraph-elixir = { workspace = true, optional = true }
codegraph-haskell = { workspace = true, optional = true }
codegraph-hcl = { workspace = true, optional = true }
codegraph-julia = { workspace = true, optional = true }
codegraph-ocaml = { workspace = true, optional = true }
codegraph-perl = { workspace = true, optional = true }
codegraph-toml = { workspace = true, optional = true }
codegraph-yaml = { workspace = true, optional = true }
codegraph-clojure = { workspace = true, optional = true }
codegraph-css = { workspace = true, optional = true }
codegraph-elm = { workspace = true, optional = true }
codegraph-erlang = { workspace = true, optional = true }
codegraph-objc = { workspace = true, optional = true }
codegraph-solidity = { workspace = true, optional = true }
codegraph-dockerfile = { workspace = true, optional = true }

# Memory layer
codegraph-memory.workspace = true

# CLI
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[features]
default = ["all-grammars"]
all-grammars = [
  "grammar-bash",
  "grammar-c",
  "grammar-clojure",
  "grammar-cobol",
  "grammar-cpp",
  "grammar-css",
  "grammar-csharp",
  "grammar-dart",
  "grammar-dockerfile",
  "grammar-elixir",
  "grammar-elm",
  "grammar-erlang",
  "grammar-fortran",
  "grammar-go",
  "grammar-groovy",
  "grammar-haskell",
  "grammar-hcl",
  "grammar-java",
  "grammar-julia",
  "grammar-kotlin",
  "grammar-lua",
  "grammar-objc",
  "grammar-ocaml",
  "grammar-perl",
  "grammar-php",
  "grammar-python",
  "grammar-r",
  "grammar-ruby",
  "grammar-rust",
  "grammar-scala",
  "grammar-solidity",
  "grammar-swift",
  "grammar-tcl",
  "grammar-toml",
  "grammar-typescript",
  "grammar-verilog",
  "grammar-yaml",
  "grammar-zig",
]
grammar-bash = ["dep:codegraph-bash"]
grammar-c = ["dep:codegraph-c"]
grammar-clojure = ["dep:codegraph-clojure"]
grammar-cobol = ["dep:codegraph-cobol"]
grammar-cpp = ["dep:codegraph-cpp"]
