[package]
name = "lyra-lsp-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
node-api = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2.16.13", optional = true }
once_cell = "1.20.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
url = "2.5.4"

[build-dependencies]
napi-build = "2.1.4"
