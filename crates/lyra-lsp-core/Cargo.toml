[package]
name = "lyra-lsp-core"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[features]
default = []
node-api = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2.16.13", optional = true }
once_cell = "1.20.2"
lyra-process-lifecycle-core = { path = "../lyra-process-lifecycle-core" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
url = "2.5.4"
dirs.workspace = true
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
which.workspace = true
zip = { workspace = true }
flate2 = "1"
tar = "0.4"

[build-dependencies]
napi-build = "2.1.4"
