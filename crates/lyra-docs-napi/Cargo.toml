[package]
name = "lyra-docs-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lyra-docs-core = { path = "../lyra-docs-core" }
lyra-agent-reader = { path = "../lyra-agent-reader", default-features = false }
base64 = "0.22.1"
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

[build-dependencies]
napi-build = "2.1.4"
