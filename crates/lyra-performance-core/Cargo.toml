[package]
name = "lyra-performance-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lyra_performance_core"
path = "src/lib.rs"

[[bin]]
name = "lyra-performance-helper"
path = "src/bin/lyra-performance-helper.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock"] }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemServices"] }
