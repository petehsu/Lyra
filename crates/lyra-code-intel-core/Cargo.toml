[package]
name = "lyra-code-intel-core"
version = "0.1.0"
edition = "2021"

[dependencies]
globset = "0.4.15"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4.24"
once_cell = "1.21.3"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
# Use arborium's tree-sitter binding to avoid duplicate-native-library conflicts.
# API-identical to the upstream `tree-sitter` crate.
tree-sitter = { package = "arborium-tree-sitter", version = "2.18.0" }
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
