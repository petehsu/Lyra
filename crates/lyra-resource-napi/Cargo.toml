[package]
name = "lyra-resource-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
lyra-resource-core = { path = "../lyra-resource-core" }
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
once_cell = "1.20.2"
serde_json = "1.0.138"

[build-dependencies]
napi-build = "2.1.4"
