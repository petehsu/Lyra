[package]
name = "lyra-agent-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
dirs.workspace = true
lyra-agent-api.workspace = true
lyra-agent-kernel.workspace = true
lyra-agent-plugins.workspace = true
# Enable the real BPE tokenizer (o200k_base) so token estimates used for
# context-window trimming and memory checkpoints are accurate for CJK/code.
lyra-agent-reader = { workspace = true, features = ["tokenizer-tiktoken"] }
lyra-hardware-core.workspace = true
lyra-search-core.workspace = true
lyra-tool-fs-core.workspace = true
futures = { workspace = true, features = ["executor"] }
diffy.workspace = true
glob.workspace = true
hmac.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp"] }
libc.workspace = true
minijinja.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
regex.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
thiserror.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
