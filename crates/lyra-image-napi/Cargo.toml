[package]
name = "lyra-image-napi"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
lyra-image-core = { path = "../lyra-image-core" }
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
once_cell = "1.20.2"

[build-dependencies]
napi-build = "2.1.4"
