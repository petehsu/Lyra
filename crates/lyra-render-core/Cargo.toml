[package]
name = "lyra-render-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["highlight", "math", "mermaid"]
highlight = ["dep:arborium"]
math = ["dep:ratex-layout", "dep:ratex-parser", "dep:ratex-svg", "dep:ratex-types"]
mermaid = ["dep:merman"]

[dependencies]
arborium = { version = "2.18.0", default-features = false, optional = true, features = [
    "lang-rust",
    "lang-typescript",
    "lang-tsx",
    "lang-javascript",
    "lang-python",
    "lang-json",
    "lang-bash",
] }
blake3 = { workspace = true }
lru = { workspace = true }
once_cell = "1.21.3"
pulldown-cmark = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

merman = { version = "0.8.0-alpha.1", optional = true, default-features = false, features = ["render"] }
ratex-layout = { version = "0.1.11", optional = true }
ratex-parser = { version = "0.1.11", optional = true }
ratex-svg = { version = "0.1.11", optional = true, features = ["standalone"] }
ratex-types = { version = "0.1.11", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }