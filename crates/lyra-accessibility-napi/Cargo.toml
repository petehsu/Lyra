[package]
name = "lyra-accessibility-napi"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
lyra-computer-use-core = { path = "../lyra-computer-use-core" }

# On Linux, enable the AT-SPI2 backend so the Computer Use surface is live there
# too. macOS (AXUIElement) and Windows (UIA) backends auto-activate by target
# cfg and need no feature; only Linux is feature-gated in the core crate.
[target.'cfg(target_os = "linux")'.dependencies]
lyra-computer-use-core = { path = "../lyra-computer-use-core", features = ["linux-atspi"] }

[build-dependencies]
napi-build = "2.1.4"
