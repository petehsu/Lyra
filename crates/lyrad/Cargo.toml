[package]
name = "lyrad"
version = "0.1.0"
edition = "2021"

[dependencies]
lyra-code-intel-core = { path = "../lyra-code-intel-core" }
lyra-lsp-core = { path = "../lyra-lsp-core", default-features = false }
lyra-mcp-core = { path = "../lyra-mcp-core", default-features = false }
lyra-runtime-protocol = { path = "../lyra-runtime-protocol" }
lyra-terminal-core = { path = "../lyra-terminal-core", default-features = false }
lyra-app-server-client = { path = "../lyra-agent-core/app-server-client" }
lyra-app-server-protocol = { path = "../lyra-agent-core/app-server-protocol" }
lyra-arg0 = { path = "../lyra-agent-core/arg0" }
lyra-core = { path = "../lyra-agent-core/core" }
lyra-exec-server = { path = "../lyra-agent-core/exec-server" }
lyra-local-search = { path = "../lyra-local-search" }
lyra-models-manager = { path = "../lyra-agent-core/models-manager" }
lyra-protocol = { path = "../lyra-agent-core/protocol" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rayon = "1.10.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.24.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
futures = "0.3.32"
http = "1.3.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-bedrockruntime = "1"
aws-types = "1"
gcp_auth = "0.12"
url = "2.5.7"
uuid = { version = "1.11.0", features = ["v4"] }
rusqlite = "0.32.1"
toml = "0.9.8"
sha2 = "0.10.9"
chrono = { version = "0.4.42", features = ["clock"] }
icu_calendar = "=2.1.1"
icu_calendar_data = "=2.1.1"
icu_collections = "=2.1.1"
icu_decimal = "=2.1.1"
icu_decimal_data = "=2.1.1"
icu_locale = "=2.1.1"
icu_locale_core = "=2.1.1"
icu_locale_data = "=2.1.2"
icu_normalizer = "=2.1.1"
icu_normalizer_data = "=2.1.1"
icu_properties = "=2.1.2"
icu_properties_data = "=2.1.2"
icu_provider = { version = "=2.1.1", features = ["sync"] }
ixdtf = "=0.6.4"
timezone_provider = "=0.1.2"
tinystr = "=0.8.2"
