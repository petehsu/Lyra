[package]
name = "lyrad"
version = "0.1.0"
edition = "2021"

[dependencies]
lyra-ai-core = { path = "../lyra-ai-core" }
lyra-lsp-core = { path = "../lyra-lsp-core", default-features = false }
lyra-mcp-core = { path = "../lyra-mcp-core", default-features = false }
lyra-runtime-protocol = { path = "../lyra-runtime-protocol" }
lyra-terminal-core = { path = "../lyra-terminal-core", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rayon = "1.10.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
url = "2.5.7"
uuid = { version = "1.11.0", features = ["v4"] }
