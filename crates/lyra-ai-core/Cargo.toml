[package]
name = "lyra-ai-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
node-api = []

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
lyra-code-intel-core = { path = "../lyra-code-intel-core" }
lyra-lsp-core = { path = "../lyra-lsp-core", default-features = false }
lyra-sandbox = { path = "../lyra-sandbox" }
lyra-terminal-core = { path = "../lyra-terminal-core", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
keyring = "3.6.2"
once_cell = "1.21.3"
uuid = { version = "1.11.0", features = ["v4"] }
url = "2.5.4"
configparser = "3.1.0"
crc32fast = "1.5.0"
hex = "0.4.3"
hmac = "0.12.1"
jsonwebtoken = "9.3.1"
percent-encoding = "2.3.1"
sha2 = "0.10.9"
time = { version = "0.3.37", features = ["formatting"] }
globset = "0.4.15"
tracing = "0.1.41"
regex = "1.11.1"
