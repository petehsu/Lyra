[package]
name = "lyra-mcp-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["node-api"]
node-api = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2.16.13", optional = true }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
uuid = { version = "1.11.0", features = ["v4"] }
keyring = "3.6.2"
once_cell = "1.21.3"

[build-dependencies]
napi-build = "2.1.4"
