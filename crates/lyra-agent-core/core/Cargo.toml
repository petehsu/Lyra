[package]
edition.workspace = true
license.workspace = true
name = "lyra-core"
version.workspace = true

[lib]
doctest = false
name = "lyra_core"
path = "src/lib.rs"

[[bin]]
name = "lyra-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
lyra-analytics = { workspace = true }
lyra-api = { workspace = true }
lyra-app-server-protocol = { workspace = true }
lyra-apply-patch = { workspace = true }
lyra-async-utils = { workspace = true }
lyra-code-mode = { workspace = true }
lyra-connectors = { workspace = true }
lyra-config = { workspace = true }
lyra-core-plugins = { workspace = true }
lyra-core-skills = { workspace = true }
crypto_box = { workspace = true }
lyra-exec-server = { workspace = true }
lyra-features = { workspace = true }
lyra-login = { workspace = true }
lyra-mcp = { workspace = true }
lyra-model-provider-info = { workspace = true }
lyra-models-manager = { workspace = true }
ed25519-dalek = { workspace = true }
lyra-shell-command = { workspace = true }
lyra-execpolicy = { workspace = true }
lyra-git-utils = { workspace = true }
lyra-hooks = { workspace = true }
lyra-instructions = { workspace = true }
lyra-network-proxy = { workspace = true }
lyra-otel = { workspace = true }
lyra-plugin = { workspace = true }
lyra-model-provider = { workspace = true }
lyra-protocol = { workspace = true }
lyra-response-debug-context = { workspace = true }
lyra-rollout = { workspace = true }
lyra-rollout-trace = { workspace = true }
lyra-rmcp-client = { workspace = true }
lyra-sandboxing = { workspace = true }
lyra-state = { workspace = true }
lyra-terminal-detection = { workspace = true }
lyra-thread-store = { workspace = true }
lyra-tools = { workspace = true }
lyra-utils-absolute-path = { workspace = true }
lyra-utils-cache = { workspace = true }
lyra-utils-image = { workspace = true }
lyra-utils-home-dir = { workspace = true }
lyra-utils-output-truncation = { workspace = true }
lyra-utils-path = { workspace = true }
lyra-utils-plugins = { workspace = true }
lyra-utils-pty = { workspace = true }
lyra-utils-readiness = { workspace = true }
lyra-secrets = { workspace = true }
lyra-utils-string = { workspace = true }
lyra-utils-stream-parser = { workspace = true }
lyra-utils-template = { workspace = true }
lyra-windows-sandbox = { package = "lyra-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
env-flags = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
whoami = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
lyra-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
lyra-arg0 = { workspace = true }
lyra-otel = { workspace = true }
lyra-test-binary-support = { workspace = true }
lyra-utils-cargo-bin = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
