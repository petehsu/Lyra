[package]
name = "lyra-terminal-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["node-api"]
node-api = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2.16.13", optional = true }
once_cell = "1.20.2"
portable-pty = "0.7.0"
chrono = { workspace = true, features = ["clock"] }
regex = { workspace = true }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vt100 = { workspace = true }

[build-dependencies]
napi-build = "2.1.4"
