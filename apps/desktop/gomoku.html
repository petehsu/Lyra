<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .game-info {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .current-player {
            font-weight: bold;
            color: #2c3e50;
        }
        .board-container {
            background: #deb887;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 0;
            background: #deb887;
            border: 2px solid #8b4513;
        }
        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid #8b4513;
            position: relative;
            cursor: pointer;
            background: #deb887;
        }
        .cell:hover {
            background: #d2b48c;
        }
        .stone {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            pointer-events: none;
        }
        .black {
            background: #000;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }
        .white {
            background: #fff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            font-size: 16px;
            padding: 10px 20px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            background: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #2980b9;
        }
        .winner {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>五子棋游戏</h1>
    <div class="game-info">
        当前玩家：<span class="current-player" id="currentPlayer">黑棋</span>
    </div>
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>
    <div class="buttons">
        <button onclick="restartGame()">重新开始</button>
        <button onclick="switchPlayer()">切换玩家</button>
    </div>
    <div class="winner" id="winner"></div>

    <script>
        const BOARD_SIZE = 15;
        let board = [];
        let currentPlayer = 'black';
        let gameOver = false;

        // 初始化棋盘
        function initBoard() {
            board = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                board[i] = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    board[i][j] = null;
                }
            }
        }

        // 创建棋盘UI
        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.onclick = () => placeStone(i, j);
                    boardElement.appendChild(cell);
                }
            }
        }

        // 放置棋子
        function placeStone(row, col) {
            if (gameOver || board[row][col] !== null) {
                return;
            }

            board[row][col] = currentPlayer;
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const stone = document.createElement('div');
            stone.className = `stone ${currentPlayer}`;
            cell.appendChild(stone);

            if (checkWin(row, col)) {
                gameOver = true;
                const winnerText = currentPlayer === 'black' ? '黑棋获胜！' : '白棋获胜！';
                document.getElementById('winner').textContent = winnerText;
                return;
            }

            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            updateCurrentPlayer();
        }

        // 检查是否获胜
        function checkWin(row, col) {
            const directions = [
                [[0, 1], [0, -1]], // 水平
                [[1, 0], [-1, 0]], // 垂直
                [[1, 1], [-1, -1]], // 对角线\n                [[1, -1], [-1, 1]] // 反对角线/
            ];

            for (const direction of directions) {
                let count = 1;
                
                for (const [dr, dc] of direction) {
                    let r = row + dr;
                    let c = col + dc;
                    
                    while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === currentPlayer) {
                        count++;
                        r += dr;
                        c += dc;
                    }
                }
                
                if (count >= 5) {
                    return true;
                }
            }
            
            return false;
        }

        // 更新当前玩家显示
        function updateCurrentPlayer() {
            const playerText = currentPlayer === 'black' ? '黑棋' : '白棋';
            document.getElementById('currentPlayer').textContent = playerText;
        }

        // 重新开始游戏
        function restartGame() {
            gameOver = false;
            currentPlayer = 'black';
            document.getElementById('winner').textContent = '';
            initBoard();
            createBoard();
            updateCurrentPlayer();
        }

        // 切换玩家（调试功能）
        function switchPlayer() {
            if (!gameOver) {
                currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
                updateCurrentPlayer();
            }
        }

        // 初始化游戏
        initBoard();
        createBoard();
        updateCurrentPlayer();
    </script>
</body>
</html>
