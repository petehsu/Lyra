<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' lyra-app-module:; style-src 'self' 'unsafe-inline' lyra-app-module:; img-src 'self' data: file: https: lyra-file: lyra-app-module:; font-src 'self' data: lyra-app-module:; connect-src 'self' ws: wss: http: https: lyra-file: lyra-app-module:; frame-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Lyra Workbench</title>
  </head>
  <body>
    <div id="app">
      <div id="lyra-bootstrap-screen" aria-label="LYRA">
        <div id="lyra-bootstrap-brand">LYRA</div>
        <div id="lyra-bootstrap-status">Preparing Lyra...</div>
      </div>
    </div>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: transparent;
        color: #242529;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #lyra-bootstrap-screen {
        width: 100%;
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        background: rgba(246, 245, 246, 0.28);
        backdrop-filter: blur(32px) saturate(1.25);
        -webkit-backdrop-filter: blur(32px) saturate(1.25);
      }

      #lyra-bootstrap-brand {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0;
      }

      #lyra-bootstrap-status {
        color: #6f7074;
        font-size: 13px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #dedede;
        }

        #lyra-bootstrap-screen {
          background: rgba(25, 25, 25, 0.28);
        }

        #lyra-bootstrap-status {
          color: #8e8f90;
        }
      }
    </style>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
