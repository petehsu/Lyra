[workspace]
members = [
  "crates/lyra-code-intel-core",
  "crates/lyrad",
  "crates/lyra-runtime-protocol",
  "crates/lyra-sandbox",
  "crates/lyra-terminal-core",
  "crates/lyra-files-napi",
  "crates/lyra-lsp-core",
  "crates/lyra-skills-napi",
  "crates/lyra-docs-core",
  "crates/lyra-docs-napi",
  "crates/lyra-mcp-core"
]
exclude = ["agent-core/rust"]
resolver = "2"

