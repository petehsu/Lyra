[package]
edition.workspace = true
license.workspace = true
name = "lyra-models-manager"
version.workspace = true

[lib]
doctest = false
name = "lyra_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
lyra-api = { workspace = true }
lyra-app-server-protocol = { workspace = true }
lyra-collaboration-mode-templates = { workspace = true }
lyra-config = { workspace = true }
lyra-login = { workspace = true }
lyra-model-provider-info = { workspace = true }
lyra-otel = { workspace = true }
lyra-model-provider = { workspace = true }
lyra-protocol = { workspace = true }
lyra-response-debug-context = { workspace = true }
lyra-utils-output-truncation = { workspace = true }
lyra-utils-template = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
base64 = { workspace = true }
lyra-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
