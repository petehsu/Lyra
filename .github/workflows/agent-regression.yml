name: Agent Vertical Slice

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  agent-vertical-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prompt contract gate
        run: pnpm lint:prompt-contract

      - name: i18n integrity check
        run: pnpm --filter @lyra/desktop lint:i18n

      - name: Run Rust Agent slice tests
        run: cargo test -p lyrad -p lyra-agent-core

      - name: Run desktop AI regression tests
        run: |
          pnpm --filter @lyra/desktop test -- ai-panel

      - name: Typecheck desktop
        run: pnpm --filter @lyra/desktop typecheck
