name: Agent Vertical Slice

on:
  workflow_dispatch:

concurrency:
  group: hosted-agent-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-vertical-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prompt contract gate
        run: pnpm lint:prompt-contract

      - name: i18n integrity check
        run: pnpm --filter @lyra/desktop lint:i18n

      - name: Run Rust Agent slice tests
        run: cargo test -p lyrad -p lyra-agent-core

      - name: Run desktop AI regression tests
        run: >-
          pnpm --filter @lyra/desktop exec vitest run
          src/modules/workbench/ai-panel

      - name: Typecheck desktop
        run: pnpm --filter @lyra/desktop typecheck
