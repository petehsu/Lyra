name: Guardrails

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run structure guard
        run: npm run lint:structure
      - name: Run UI anti-web guard
        run: npm run lint:ui-style
