name: Guardrails

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository guardrails
        run: pnpm check
      - name: Generate Linux notice inventory for diagnosis
        if: failure()
        run: pnpm legal:generate
      - name: Upload Linux notice inventory for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-generated-notices
          path: legal/generated
          if-no-files-found: error
