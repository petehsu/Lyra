name: Check language-pack source manifest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, X64, lyra-local]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tools/generate-language-pack-source-manifest.ts --check
