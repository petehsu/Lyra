name: Check language-pack source manifest

on:
  pull_request:
    paths:
      - apps/desktop/src/shared/i18n/en-US/**
      - apps/desktop/src/shared/language-packs.ts
      - tools/generate-language-pack-source-manifest.ts
      - language-packs/source-manifest.v1.json
  push:
    branches: [main]
    paths:
      - apps/desktop/src/shared/i18n/en-US/**
      - apps/desktop/src/shared/language-packs.ts
      - tools/generate-language-pack-source-manifest.ts
      - language-packs/source-manifest.v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Verify local toolchain
        run: |
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Node 24 is required')"
          test "$(pnpm --version)" = "11.7.0"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec tsx tools/generate-language-pack-source-manifest.ts --check
