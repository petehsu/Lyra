name: Rust Clippy

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native build prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libssl-dev libasound2-dev libudev-dev libdbus-1-dev
          libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-deps
