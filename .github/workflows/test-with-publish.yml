name: Test With Publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version (for example 0.1.0-preview.1)
        default: 0.1.0-preview.1
        required: true
        type: string
      release_tag:
        description: Tag to create in petehsu/lyra-releases
        default: v0.1.0-preview.1
        required: true
        type: string
      sequence:
        description: Monotonically increasing Preview catalog sequence
        default: 1
        required: true
        type: number
      publish:
        description: Create a draft Preview release after every selected target passes
        default: false
        required: true
        type: boolean
      release_scope:
        description: Build on the local Intel Mac now, or use all hosted platforms later
        default: local-darwin-x64
        required: true
        type: choice
        options:
          - local-darwin-x64
          - hosted-darwin-x64
          - all-hosted

permissions:
  contents: read

concurrency:
  group: modular-preview-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  CARGO_TERM_COLOR: always
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  release-gates:
    name: Contracts, tests, docs, and notices
    runs-on: ubuntu-latest
    outputs:
      package_matrix: ${{ steps.release-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: pnpm/action-setup@v4
        if: inputs.release_scope != 'local-darwin-x64'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        if: inputs.release_scope != 'local-darwin-x64'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.release_scope != 'local-darwin-x64'

      - name: Verify local toolchain
        if: inputs.release_scope == 'local-darwin-x64'
        shell: bash
        run: |
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Node 24 is required')"
          test "$(pnpm --version)" = "$PNPM_VERSION"
          rustc --version
          cargo --version

      - name: Install native build prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libssl-dev libasound2-dev libudev-dev libdbus-1-dev
          libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          libxcb-shape0-dev libxcb-xfixes0-dev zip unzip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select release targets
        id: release-matrix
        env:
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        shell: bash
        run: |
          if [[ "$RELEASE_SCOPE" == "local-darwin-x64" ]]; then
            matrix='{"include":[{"component_target":"darwin-x64","runner":["self-hosted","macOS","X64","lyra-local"],"desktop_target":"darwin-x64","rust_target":"x86_64-apple-darwin","builder_os":"mac","builder_arch":"x64","installer_extension":"dmg","smoke_scope":"current-user"}]}'
          elif [[ "$RELEASE_SCOPE" == "hosted-darwin-x64" ]]; then
            matrix='{"include":[{"component_target":"darwin-x64","runner":["macos-15-intel"],"desktop_target":"darwin-x64","rust_target":"x86_64-apple-darwin","builder_os":"mac","builder_arch":"x64","installer_extension":"dmg","smoke_scope":"current-user"}]}'
          else
            matrix='{"include":[{"component_target":"darwin-x64","runner":["macos-15-intel"],"desktop_target":"darwin-x64","rust_target":"x86_64-apple-darwin","builder_os":"mac","builder_arch":"x64","installer_extension":"dmg","smoke_scope":"current-user"},{"component_target":"darwin-arm64","runner":["macos-15"],"desktop_target":"darwin-arm64","rust_target":"aarch64-apple-darwin","builder_os":"mac","builder_arch":"arm64","installer_extension":"dmg","smoke_scope":"system"},{"component_target":"windows-x64","runner":["windows-2025"],"desktop_target":"win32-x64","rust_target":"x86_64-pc-windows-msvc","builder_os":"win","builder_arch":"x64","installer_extension":"exe","smoke_scope":"current-user"},{"component_target":"windows-arm64","runner":["windows-11-arm"],"desktop_target":"win32-arm64","rust_target":"aarch64-pc-windows-msvc","builder_os":"win","builder_arch":"arm64","installer_extension":"exe","smoke_scope":"system"},{"component_target":"linux-x64","runner":["ubuntu-22.04"],"desktop_target":"linux-x64","rust_target":"x86_64-unknown-linux-gnu","builder_os":"linux","builder_arch":"x64","installer_extension":"AppImage","appimage_arch":"x86_64","smoke_scope":"current-user","linuxdeploy_sha256":"e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf","appimagetool_sha256":"a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"},{"component_target":"linux-arm64","runner":["ubuntu-22.04-arm"],"desktop_target":"linux-arm64","rust_target":"aarch64-unknown-linux-gnu","builder_os":"linux","builder_arch":"arm64","installer_extension":"AppImage","appimage_arch":"aarch64","smoke_scope":"system","linuxdeploy_sha256":"650ed1d045a09ab87855be1963f4f56ac7cf6defb6b2e2f4af0a3225f3d2d803","appimagetool_sha256":"1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe"}]}'
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.component_target }}
    needs: release-gates
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-gates.outputs.package_matrix) }}
    steps:
      - run: echo "would build ${{ matrix.component_target }}"

  publish-draft:
    name: Publish draft binary release
    needs: package
    if: inputs.publish && inputs.release_scope == 'all-hosted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lyra-*
          path: release-assets

      - name: Verify public binary repository and local GitHub access
        env:
          GH_TOKEN: ${{ secrets.LYRA_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api repos/petehsu/lyra-releases --jq .visibility)" = public
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/petehsu/lyra-releases/immutable-releases \
            --jq .enabled)" = true
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/petehsu/lyra-releases/releases/tags/preview-channel \
            --jq '(.draft == false and .immutable == false)')" = true

      - name: Verify flat asset names and checksums
        env:
          EXPECTED_TARGET_COUNT: ${{ inputs.release_scope == 'local-darwin-x64' && '1' || '6' }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";

          const walk = async (root) => {
            const files = [];
            for (const entry of await readdir(root, { withFileTypes: true })) {
              const candidate = path.join(root, entry.name);
              if (entry.isDirectory()) files.push(...await walk(candidate));
              else if (entry.isFile()) files.push(candidate);
            }
            return files;
          };
          const files = await walk("release-assets");
          const byName = new Map();
          for (const file of files) {
            const name = path.basename(file);
            if (byName.has(name)) {
              throw new Error(`duplicate GitHub Release asset name: ${name}`);
            }
            byName.set(name, file);
          }
          const checksumFiles = files.filter((file) =>
            path.basename(file).startsWith("SHA256SUMS-")
          );
          const expectedTargetCount = Number(process.env.EXPECTED_TARGET_COUNT);
          if (checksumFiles.length !== expectedTargetCount) {
            throw new Error(`expected ${expectedTargetCount} target checksum files, found ${checksumFiles.length}`);
          }
          const covered = new Set();
          for (const checksumFile of checksumFiles) {
            const lines = (await readFile(checksumFile, "utf8")).trim().split("\n");
            for (const line of lines) {
              const match = /^([0-9a-f]{64})  ([^/\\]+)$/.exec(line);
              if (match === null) throw new Error(`invalid flat checksum line: ${line}`);
              const [, expected, name] = match;
              const file = byName.get(name);
              if (file === undefined) throw new Error(`checksum references missing asset: ${name}`);
              if (covered.has(name)) throw new Error(`asset has multiple checksum entries: ${name}`);
              const actual = createHash("sha256").update(await readFile(file)).digest("hex");
              if (actual !== expected) throw new Error(`checksum mismatch: ${name}`);
              covered.add(name);
            }
          }
          const uncovered = [...byName.keys()].filter((name) =>
            !name.startsWith("SHA256SUMS-") && !covered.has(name)
          );
          if (uncovered.length > 0) {
            throw new Error(`release assets missing checksums: ${uncovered.join(", ")}`);
          }
          NODE

      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ secrets.LYRA_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "$RELEASE_TAG" \
            --repo petehsu/lyra-releases \
            --draft \
            --title "Lyra $RELEASE_VERSION Preview" \
            --notes "Unsigned Preview candidate. Component signatures are enforced; system-signed Core auto-replacement remains disabled."
          find release-assets -type f -print0 \
            | xargs -0 -n 20 gh release upload "$RELEASE_TAG" \
                --repo petehsu/lyra-releases
