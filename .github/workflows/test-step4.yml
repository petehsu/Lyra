name: Test Step4 Create Only

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version
        default: 0.1.0-preview.1
        required: true
        type: string
      release_tag:
        description: Tag to create
        default: v0.1.0-preview.1
        required: true
        type: string
      sequence:
        description: Sequence
        default: 1
        required: true
        type: number
      publish:
        description: Publish
        default: false
        required: true
        type: boolean
      release_scope:
        description: Scope
        default: local-darwin-x64
        required: true
        type: choice
        options:
          - local-darwin-x64
          - hosted-darwin-x64
          - all-hosted

permissions:
  contents: read

concurrency:
  group: test-step4-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "test"

  publish-draft:
    name: Publish draft binary release
    needs: test
    if: inputs.publish && inputs.release_scope == 'all-hosted'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ secrets.LYRA_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "$RELEASE_TAG" \
            --repo petehsu/lyra-releases \
            --draft \
            --title "Lyra $RELEASE_VERSION Preview" \
            --notes "Unsigned Preview candidate."
          find release-assets -type f -print0 \
            | xargs -0 -n 20 gh release upload "$RELEASE_TAG" \
                --repo petehsu/lyra-releases